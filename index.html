<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間矩陣看板 · 極簡莫蘭迪</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F5F3EF',
              card: '#FFFFFF',
              subtle: '#EAE6DF',
              border: '#E2DDD5',
              text: '#3A3836',
              muted: '#7E7A75',
              q1: '#D68C7A', // 暖陶土粉（緊急重要）
              q2: '#7E99A3', // 霧霾灰藍（重要規劃）
              q3: '#CCA675', // 溫潤薑黃（緊急待辦）
              q4: '#8FA38D', // 鼠尾草綠（餘裕成長）
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F3EF;
      color: #3A3836;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D8D2C9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen p-3 md:p-6 lg:p-8 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="max-w-7xl mx-auto w-full mb-6">
    <div class="bg-white/80 backdrop-blur-md border border-morandi-border/80 rounded-2xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
      
      <!-- 主標題 -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-morandi-subtle flex items-center justify-center text-morandi-text text-xl">
          <i class="ph-bold ph-squares-four"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-semibold tracking-wide text-morandi-text">時間矩陣看板</h1>
      </div>

      <!-- 日期導航 -->
      <div class="flex items-center gap-2 bg-morandi-bg/80 px-3 py-1.5 rounded-xl border border-morandi-border/60">
        <button onclick="changeDay(-1)" class="p-1.5 hover:bg-white rounded-lg text-morandi-muted hover:text-morandi-text transition">
          <i class="ph-bold ph-caret-left"></i>
        </button>
        <span id="currentDateDisplay" class="text-sm md:text-base font-medium px-2">載入中...</span>
        <button onclick="changeDay(1)" class="p-1.5 hover:bg-white rounded-lg text-morandi-muted hover:text-morandi-text transition">
          <i class="ph-bold ph-caret-right"></i>
        </button>
        <button onclick="resetToToday()" class="ml-1 text-xs px-2.5 py-1 bg-white hover:bg-morandi-subtle text-morandi-text rounded-lg border border-morandi-border/80 font-medium transition">
          今天
        </button>
      </div>

      <!-- 右側工具區 -->
      <div class="flex items-center gap-2.5">
        <!-- 整合設定按鈕 -->
        <button onclick="openConfigModal()" class="flex items-center gap-2 px-3.5 py-2 bg-white hover:bg-morandi-subtle border border-morandi-border text-morandi-text rounded-xl text-sm font-medium transition shadow-sm">
          <i class="ph-bold ph-google-logo text-blue-600"></i>
          <span>設定</span>
        </button>

        <!-- 重新整理 -->
        <button onclick="fetchEvents()" title="同步日曆" class="p-2.5 bg-white hover:bg-morandi-subtle border border-morandi-border text-morandi-muted hover:text-morandi-text rounded-xl transition shadow-sm">
          <i class="ph-bold ph-arrows-clockwise text-base" id="syncIcon"></i>
        </button>

        <!-- 新增自訂任務 -->
        <button onclick="openAddTaskModal()" class="flex items-center gap-1.5 px-4 py-2 bg-morandi-text hover:opacity-90 text-white rounded-xl text-sm font-medium transition shadow-sm">
          <i class="ph-bold ph-plus"></i>
          <span>新行程</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
    
    <!-- 左側：今日時間表 (4 欄寬) -->
    <section class="lg:col-span-4 bg-white/90 border border-morandi-border rounded-2xl p-5 shadow-sm flex flex-col h-full max-h-[750px]">
      <div class="flex items-center justify-between pb-4 border-b border-morandi-border/60 mb-3">
        <div class="flex items-center gap-2">
          <i class="ph-bold ph-calendar-blank text-lg text-morandi-muted"></i>
          <h2 class="text-lg font-semibold text-morandi-text">日曆時間表</h2>
        </div>
        <span id="timelineCountBadge" class="text-xs px-2.5 py-1 bg-morandi-subtle text-morandi-muted rounded-full font-medium">0 項行程</span>
      </div>

      <div id="timelineList" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1">
        <!-- 動態注入時間表事件 -->
      </div>

      <!-- 狀態提示 -->
      <div class="pt-3 mt-2 border-t border-morandi-border/60 flex items-center justify-between text-xs text-morandi-muted">
        <div class="flex items-center gap-2">
          <span id="syncIndicator" class="w-2 h-2 rounded-full bg-morandi-muted/40"></span>
          <span id="syncStatusText">未連動 Google 日曆</span>
        </div>
        <span id="lastSyncTime"></span>
      </div>
    </section>

    <!-- 右側：2x2 四象限管理看板 (8 欄寬) -->
    <section class="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-4 h-full max-h-[750px]">
      
      <!-- 象限 1 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[360px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q1"></span>
            <input id="q1TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q1 outline-none transition" value="重要且緊急" onchange="updateQuadTitle(1, this.value)">
          </div>
          <span id="q1Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q1/20 text-morandi-q1">0</span>
        </div>
        <div id="q1List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 2 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[360px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q2"></span>
            <input id="q2TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q2 outline-none transition" value="重要不緊急" onchange="updateQuadTitle(2, this.value)">
          </div>
          <span id="q2Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q2/20 text-morandi-q2">0</span>
        </div>
        <div id="q2List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 3 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[360px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q3"></span>
            <input id="q3TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q3 outline-none transition" value="緊急不重要" onchange="updateQuadTitle(3, this.value)">
          </div>
          <span id="q3Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q3/20 text-morandi-q3">0</span>
        </div>
        <div id="q3List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 4 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[360px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q4"></span>
            <input id="q4TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q4 outline-none transition" value="稍後思考" onchange="updateQuadTitle(4, this.value)">
          </div>
          <span id="q4Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q4/20 text-morandi-q4">0</span>
        </div>
        <div id="q4List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

    </section>
  </main>

  <!-- 頁尾 -->
  <footer class="max-w-7xl mx-auto w-full mt-6 flex justify-end">
    <button onclick="resetDefaults()" class="text-xs text-morandi-muted hover:text-morandi-text flex items-center gap-1 transition">
      <i class="ph-bold ph-arrow-counter-clockwise"></i>
      <span>重設預設配置</span>
    </button>
  </footer>

  <!-- 設定彈窗 (Modal) -->
  <div id="configModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-morandi-border">
      <div class="flex items-center justify-between pb-3 border-b border-morandi-border">
        <h3 class="text-lg font-semibold text-morandi-text flex items-center gap-2">
          <i class="ph-bold ph-sliders"></i>
          <span>設定與日曆連動</span>
        </h3>
        <button onclick="closeConfigModal()" class="text-morandi-muted hover:text-morandi-text p-1">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <div class="mt-4 space-y-4 text-sm">
        <!-- Client ID -->
        <div>
          <label class="block text-xs font-medium text-morandi-muted mb-1">Google OAuth Client ID</label>
          <input id="clientIdInput" type="text" placeholder="例如：xxxxxx.apps.googleusercontent.com" class="w-full px-3 py-2 border border-morandi-border rounded-xl focus:border-morandi-text outline-none text-xs text-morandi-text">
        </div>

        <!-- 授權操作 -->
        <div class="p-3 bg-morandi-bg rounded-xl flex items-center justify-between">
          <div>
            <div class="font-medium text-morandi-text" id="modalAuthStatus">未授權</div>
            <div class="text-xs text-morandi-muted">連線至您的 Google 帳戶以抓取真實日曆</div>
          </div>
          <button id="authBtn" onclick="requestGoogleAuth()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition">
            連動授權
          </button>
        </div>

        <div class="text-xs text-morandi-muted leading-relaxed">
          💡 貼心提醒：請確認已在 Google Cloud Console 將 <code class="bg-morandi-subtle px-1 rounded" id="currentOriginDisplay"></code> 加入「已授權的 JavaScript 來源」。
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button onclick="closeConfigModal()" class="px-4 py-2 border border-morandi-border text-morandi-muted hover:text-morandi-text rounded-xl text-xs font-medium">關閉</button>
        <button onclick="saveConfig()" class="px-4 py-2 bg-morandi-text text-white rounded-xl text-xs font-medium">儲存配置</button>
      </div>
    </div>
  </div>

  <!-- 新增行程彈窗 (Modal) -->
  <div id="addTaskModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-morandi-border">
      <h3 class="text-lg font-semibold text-morandi-text mb-4">新增行程 / 任務</h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-morandi-muted mb-1">任務名稱</label>
          <input id="newTaskTitle" type="text" placeholder="輸入行程內容" class="w-full px-3 py-2 border border-morandi-border rounded-xl outline-none focus:border-morandi-text">
        </div>
        <div>
          <label class="block text-xs text-morandi-muted mb-1">時間（選填）</label>
          <input id="newTaskTime" type="text" placeholder="例如：14:00 - 15:30" class="w-full px-3 py-2 border border-morandi-border rounded-xl outline-none focus:border-morandi-text">
        </div>
        <div>
          <label class="block text-xs text-morandi-muted mb-1">指定象限</label>
          <select id="newTaskQuad" class="w-full px-3 py-2 border border-morandi-border rounded-xl outline-none bg-white">
            <option value="1">象限 1 (重要且緊急)</option>
            <option value="2">象限 2 (重要不緊急)</option>
            <option value="3">象限 3 (緊急不重要)</option>
            <option value="4">象限 4 (稍後思考)</option>
          </select>
        </div>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button onclick="closeAddTaskModal()" class="px-4 py-2 border border-morandi-border text-morandi-muted rounded-xl text-xs">取消</button>
        <button onclick="confirmAddTask()" class="px-4 py-2 bg-morandi-text text-white rounded-xl text-xs">確認新增</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       狀態與預設資料
    ========================================== */
    let currentDate = new Date();
    let accessToken = null;
    let tokenClient = null;

    let quadTitles = JSON.parse(localStorage.getItem('quad_titles')) || {
      1: "重要且緊急",
      2: "重要不緊急",
      3: "緊急不重要",
      4: "稍後思考"
    };

    let localTasks = JSON.parse(localStorage.getItem('local_tasks')) || [];
    let googleEvents = [];

    /* ==========================================
       初始化
    ========================================== */
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('currentOriginDisplay').innerText = window.location.origin;
      const savedClientId = localStorage.getItem('gcal_client_id') || '';
      document.getElementById('clientIdInput').value = savedClientId;

      updateDateHeader();
      loadQuadTitlesUI();
      renderAll();

      if (savedClientId) {
        initGoogleClient(savedClientId);
      }
    });

    function updateDateHeader() {
      const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const y = currentDate.getFullYear();
      const m = currentDate.getMonth() + 1;
      const d = currentDate.getDate();
      const w = days[currentDate.getDay()];
      
      const isToday = new Date().toDateString() === currentDate.toDateString();
      document.getElementById('currentDateDisplay').innerText = `${y}年 ${m}月 ${d}日 (${w}${isToday ? ' · 今天' : ''})`;
    }

    function changeDay(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      updateDateHeader();
      fetchEvents();
    }

    function resetToToday() {
      currentDate = new Date();
      updateDateHeader();
      fetchEvents();
    }

    function loadQuadTitlesUI() {
      for (let i = 1; i <= 4; i++) {
        const input = document.getElementById(`q${i}TitleInput`);
        if (input && quadTitles[i]) input.value = quadTitles[i];
      }
    }

    function updateQuadTitle(qNum, val) {
      quadTitles[qNum] = val.trim() || `象限 ${qNum}`;
      localStorage.setItem('quad_titles', JSON.stringify(quadTitles));
    }

    /* ==========================================
       Google Identity Services 授權
    ========================================== */
    function initGoogleClient(clientId) {
      if (typeof google === 'undefined' || !google.accounts) {
        console.warn('[Google] SDK 尚未載入完成，等待重試...');
        setTimeout(() => initGoogleClient(clientId), 500);
        return;
      }

      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events.readonly',
          callback: (response) => {
            if (response.error) {
              console.error('[Google Auth Error]', response);
              alert('Google 授權失敗：' + (response.error_description || response.error));
              return;
            }
            console.log('[Google Auth Success] 取得 Access Token');
            accessToken = response.access_token;
            updateSyncStatus(true);
            fetchEvents();
            closeConfigModal();
          },
        });
        console.log('[Google Auth] Client 初始化成功');
      } catch (err) {
        console.error('[Google Init Exception]', err);
      }
    }

    function requestGoogleAuth() {
      const inputId = document.getElementById('clientIdInput').value.trim();
      if (!inputId) {
        alert('請先輸入 Google OAuth Client ID！');
        return;
      }
      localStorage.setItem('gcal_client_id', inputId);
      
      if (!tokenClient) {
        initGoogleClient(inputId);
      }

      if (tokenClient) {
        console.log('[Google Auth] 正在呼叫授權彈窗...');
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        alert('Google 服務載入中，請稍候 3 秒後再試一次。');
      }
    }

    function updateSyncStatus(connected) {
      const ind = document.getElementById('syncIndicator');
      const txt = document.getElementById('syncStatusText');
      const modalTxt = document.getElementById('modalAuthStatus');
      const authBtn = document.getElementById('authBtn');

      if (connected) {
        ind.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        txt.innerText = '已連線 Google 日曆';
        txt.className = 'text-emerald-700 font-medium';
        modalTxt.innerText = '已成功授權連線';
        modalTxt.className = 'font-medium text-emerald-600';
        authBtn.innerText = '重新授權';
      } else {
        ind.className = 'w-2 h-2 rounded-full bg-morandi-muted/40';
        txt.innerText = '未連動 Google 日曆';
        txt.className = 'text-morandi-muted';
        modalTxt.innerText = '未授權';
        modalTxt.className = 'font-medium text-morandi-text';
        authBtn.innerText = '連動授權';
      }
    }

    /* ==========================================
       抓取 Google 日曆事件
    ========================================== */
    async function fetchEvents() {
      const syncIcon = document.getElementById('syncIcon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      if (!accessToken) {
        if (syncIcon) setTimeout(() => syncIcon.classList.remove('animate-spin'), 300);
        renderAll();
        return;
      }

      const start = new Date(currentDate);
      start.setHours(0, 0, 0, 0);
      const end = new Date(currentDate);
      end.setHours(23, 59, 59, 999);

      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${start.toISOString()}&timeMax=${end.toISOString()}&singleEvents=true&orderBy=startTime`;

      try {
        console.log(`[Google Calendar] 正在查詢: ${start.toISOString()} ~ ${end.toISOString()}`);
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();
        console.log(`[Google Calendar] 抓取完成，共 ${data.items ? data.items.length : 0} 筆行程`, data.items);
        
        googleEvents = (data.items || []).map(ev => {
          let timeText = "全天";
          if (ev.start.dateTime) {
            const s = new Date(ev.start.dateTime);
            const e = new Date(ev.end.dateTime);
            timeText = `${String(s.getHours()).padStart(2,'0')}:${String(s.getMinutes()).padStart(2,'0')} - ${String(e.getHours()).padStart(2,'0')}:${String(e.getMinutes()).padStart(2,'0')}`;
          }
          return {
            id: ev.id,
            title: ev.summary || "(無標題)",
            time: timeText,
            location: ev.location || "",
            isGoogle: true,
            quad: 1 // 預設歸入象限 1
          };
        });

        document.getElementById('lastSyncTime').innerText = `上次同步: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      } catch (err) {
        console.error('[Google Calendar Fetch Error]', err);
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        renderAll();
      }
    }

    /* ==========================================
       畫面渲染
    ========================================== */
    function renderAll() {
      renderTimeline();
      renderQuadrants();
    }

    function renderTimeline() {
      const container = document.getElementById('timelineList');
      const badge = document.getElementById('timelineCountBadge');
      container.innerHTML = '';

      const all = [...googleEvents, ...localTasks];
      badge.innerText = `${all.length} 項行程`;

      if (all.length === 0) {
        container.innerHTML = `
          <div class="h-48 flex flex-col items-center justify-center text-morandi-muted text-xs">
            <i class="ph-bold ph-calendar-x text-3xl mb-2 opacity-40"></i>
            <span>本日尚無排程事件</span>
          </div>`;
        return;
      }

      all.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-3 rounded-xl bg-morandi-bg/60 border border-morandi-border/60 hover:bg-morandi-subtle/30 transition flex flex-col gap-1";
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="font-medium text-sm text-morandi-text truncate">${escapeHtml(item.title)}</div>
            ${item.isGoogle ? '<span class="text-[10px] px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded font-medium">Google</span>' : ''}
          </div>
          <div class="flex items-center gap-2 text-xs text-morandi-muted">
            <i class="ph-bold ph-clock"></i>
            <span>${item.time || '未指定時間'}</span>
            ${item.location ? `<span>·</span><span>${escapeHtml(item.location)}</span>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderQuadrants() {
      const all = [...googleEvents, ...localTasks];

      for (let q = 1; q <= 4; q++) {
        const listEl = document.getElementById(`q${q}List`);
        const badgeEl = document.getElementById(`q${q}Badge`);
        listEl.innerHTML = '';

        const qItems = all.filter(item => (item.quad || 1) === q);
        badgeEl.innerText = qItems.length;

        if (qItems.length === 0) {
          listEl.innerHTML = `<div class="h-32 flex items-center justify-center text-xs text-morandi-muted/60">無待辦事項</div>`;
          continue;
        }

        qItems.forEach(item => {
          const div = document.createElement('div');
          div.className = "group flex items-center justify-between p-2 rounded-lg hover:bg-morandi-subtle/40 border border-transparent hover:border-morandi-border/40 transition text-sm";
          div.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-morandi-text/40"></span>
              <span class="truncate text-morandi-text">${escapeHtml(item.title)}</span>
            </div>
            <span class="text-xs text-morandi-muted shrink-0 ml-2">${item.time || ''}</span>
          `;
          listEl.appendChild(div);
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ==========================================
       彈窗控制
    ========================================== */
    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
    function saveConfig() {
      const id = document.getElementById('clientIdInput').value.trim();
      localStorage.setItem('gcal_client_id', id);
      if (id && (!tokenClient)) initGoogleClient(id);
      closeConfigModal();
    }

    function openAddTaskModal() { document.getElementById('addTaskModal').classList.remove('hidden'); }
    function closeAddTaskModal() { document.getElementById('addTaskModal').classList.add('hidden'); }
    function confirmAddTask() {
      const t = document.getElementById('newTaskTitle').value.trim();
      const tm = document.getElementById('newTaskTime').value.trim();
      const q = parseInt(document.getElementById('newTaskQuad').value, 10);
      if (!t) return;

      localTasks.push({ id: 'loc_' + Date.now(), title: t, time: tm, quad: q });
      localStorage.setItem('local_tasks', JSON.stringify(localTasks));
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskTime').value = '';
      closeAddTaskModal();
      renderAll();
    }

    function resetDefaults() {
      if (confirm('確定要重設所有象限標題與本機設定嗎？')) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
