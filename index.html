<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間矩陣看板 · 極簡莫蘭迪</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F5F3EF',
              card: '#FFFFFF',
              subtle: '#EAE6DF',
              border: '#E2DDD5',
              text: '#3A3836',
              muted: '#7E7A75',
              q1: '#D68C7A', // 暖陶土粉
              q2: '#7E99A3', // 霧霾灰藍
              q3: '#CCA675', // 溫潤薑黃
              q4: '#8FA38D', // 鼠尾草綠
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F3EF;
      color: #3A3836;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D8D2C9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen p-3 md:p-6 lg:p-8 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="max-w-7xl mx-auto w-full mb-6">
    <div class="bg-white/80 backdrop-blur-md border border-morandi-border/80 rounded-2xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
      
      <!-- 主標題 -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-morandi-subtle flex items-center justify-center text-morandi-text text-xl">
          <i class="ph-bold ph-squares-four"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-semibold tracking-wide text-morandi-text">時間矩陣看板</h1>
          <span class="text-[11px] text-morandi-muted">自最近行程起之一週視圖 · 日期階梯漸層底色</span>
        </div>
      </div>

      <!-- 日期範圍導航 -->
      <div class="flex items-center gap-2 bg-morandi-bg/80 px-3 py-1.5 rounded-xl border border-morandi-border/60">
        <button onclick="changeDay(-1)" title="基準日前移一天" class="p-1.5 hover:bg-white rounded-lg text-morandi-muted hover:text-morandi-text transition">
          <i class="ph-bold ph-caret-left"></i>
        </button>
        <span id="currentDateDisplay" class="text-sm md:text-base font-medium px-2 text-morandi-text">載入中...</span>
        <button onclick="changeDay(1)" title="基準日後移一天" class="p-1.5 hover:bg-white rounded-lg text-morandi-muted hover:text-morandi-text transition">
          <i class="ph-bold ph-caret-right"></i>
        </button>
        <button onclick="alignToNearestEvent()" title="自動對齊最接近的下一筆行程" class="ml-1 text-xs px-2.5 py-1 bg-white hover:bg-morandi-subtle text-morandi-text rounded-lg border border-morandi-border/80 font-medium transition flex items-center gap-1">
          <i class="ph-bold ph-crosshair-simple"></i>
          <span>最近行程</span>
        </button>
      </div>

      <!-- 右側工具區 -->
      <div class="flex items-center gap-2.5">
        <button onclick="openConfigModal()" class="flex items-center gap-2 px-3.5 py-2 bg-white hover:bg-morandi-subtle border border-morandi-border text-morandi-text rounded-xl text-sm font-medium transition shadow-sm">
          <i class="ph-bold ph-sliders text-blue-600"></i>
          <span>來源綁定設定</span>
        </button>

        <button onclick="fetchAllData()" title="即時同步" class="p-2.5 bg-white hover:bg-morandi-subtle border border-morandi-border text-morandi-muted hover:text-morandi-text rounded-xl transition shadow-sm">
          <i class="ph-bold ph-arrows-clockwise text-base" id="syncIcon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
    
    <!-- 左側：一週日曆與待辦時間表 (4 欄寬) -->
    <section class="lg:col-span-4 bg-white/90 border border-morandi-border rounded-2xl p-5 shadow-sm flex flex-col h-full max-h-[760px]">
      <div class="flex items-center justify-between pb-4 border-b border-morandi-border/60 mb-3">
        <div class="flex items-center gap-2">
          <i class="ph-bold ph-calendar-blank text-lg text-morandi-muted"></i>
          <h2 class="text-lg font-semibold text-morandi-text">一週時間總表</h2>
        </div>
        <span id="timelineCountBadge" class="text-xs px-2.5 py-1 bg-morandi-subtle text-morandi-muted rounded-full font-medium">0 項項目</span>
      </div>

      <div id="timelineList" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>

      <!-- 狀態提示 -->
      <div class="pt-3 mt-2 border-t border-morandi-border/60 flex items-center justify-between text-xs text-morandi-muted">
        <div class="flex items-center gap-2">
          <span id="syncIndicator" class="w-2 h-2 rounded-full bg-morandi-muted/40"></span>
          <span id="syncStatusText">未連動 Google 帳號</span>
        </div>
        <span id="lastSyncTime"></span>
      </div>
    </section>

    <!-- 右側：2x2 四象限管理看板 (8 欄寬) -->
    <section class="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-4 h-full max-h-[760px]">
      
      <!-- 象限 1 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[368px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q1"></span>
            <input id="q1TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q1 outline-none transition" value="重要且緊急" onchange="updateQuadTitle(1, this.value)">
          </div>
          <div class="flex items-center gap-1.5">
            <span id="q1CalTag" class="text-[11px] px-2 py-0.5 bg-morandi-subtle text-morandi-muted rounded-md font-normal truncate max-w-[100px]">未綁定</span>
            <span id="q1Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q1/20 text-morandi-q1">0</span>
          </div>
        </div>
        <div id="q1List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 2 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[368px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q2"></span>
            <input id="q2TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q2 outline-none transition" value="重要不緊急" onchange="updateQuadTitle(2, this.value)">
          </div>
          <div class="flex items-center gap-1.5">
            <span id="q2CalTag" class="text-[11px] px-2 py-0.5 bg-morandi-subtle text-morandi-muted rounded-md font-normal truncate max-w-[100px]">未綁定</span>
            <span id="q2Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q2/20 text-morandi-q2">0</span>
          </div>
        </div>
        <div id="q2List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 3 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[368px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q3"></span>
            <input id="q3TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q3 outline-none transition" value="緊急不重要" onchange="updateQuadTitle(3, this.value)">
          </div>
          <div class="flex items-center gap-1.5">
            <span id="q3CalTag" class="text-[11px] px-2 py-0.5 bg-morandi-subtle text-morandi-muted rounded-md font-normal truncate max-w-[100px]">未綁定</span>
            <span id="q3Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q3/20 text-morandi-q3">0</span>
          </div>
        </div>
        <div id="q3List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

      <!-- 象限 4 -->
      <div class="bg-white/90 border border-morandi-border rounded-2xl p-4 shadow-sm flex flex-col h-[368px]">
        <div class="flex items-center justify-between pb-3 border-b border-morandi-border/60 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-morandi-q4"></span>
            <input id="q4TitleInput" class="text-base font-semibold text-morandi-text bg-transparent hover:bg-morandi-subtle/50 focus:bg-white px-1 py-0.5 rounded border-b border-transparent focus:border-morandi-q4 outline-none transition" value="稍後思考" onchange="updateQuadTitle(4, this.value)">
          </div>
          <div class="flex items-center gap-1.5">
            <span id="q4CalTag" class="text-[11px] px-2 py-0.5 bg-morandi-subtle text-morandi-muted rounded-md font-normal truncate max-w-[100px]">未綁定</span>
            <span id="q4Badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-morandi-q4/20 text-morandi-q4">0</span>
          </div>
        </div>
        <div id="q4List" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
      </div>

    </section>
  </main>

  <!-- 頁尾 -->
  <footer class="max-w-7xl mx-auto w-full mt-6 flex justify-end">
    <button onclick="resetDefaults()" class="text-xs text-morandi-muted hover:text-morandi-text flex items-center gap-1 transition">
      <i class="ph-bold ph-arrow-counter-clockwise"></i>
      <span>重設自訂名稱與綁定</span>
    </button>
  </footer>

  <!-- 設定與資料來源綁定彈窗 (Modal) -->
  <div id="configModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl border border-morandi-border max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-center justify-between pb-3 border-b border-morandi-border">
        <h3 class="text-lg font-semibold text-morandi-text flex items-center gap-2">
          <i class="ph-bold ph-sliders"></i>
          <span>設定與來源綁定</span>
        </h3>
        <button onclick="closeConfigModal()" class="text-morandi-muted hover:text-morandi-text p-1">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <div class="mt-4 space-y-4 text-sm">
        <div>
          <label class="block text-xs font-medium text-morandi-muted mb-1">Google OAuth Client ID</label>
          <input id="clientIdInput" type="text" placeholder="例如：xxxxxx.apps.googleusercontent.com" class="w-full px-3 py-2 border border-morandi-border rounded-xl focus:border-morandi-text outline-none text-xs text-morandi-text">
        </div>

        <div class="p-3 bg-morandi-bg rounded-xl flex items-center justify-between">
          <div>
            <div class="font-medium text-morandi-text" id="modalAuthStatus">未授權</div>
            <div class="text-xs text-morandi-muted" id="modalAuthSubtext">連線至 Google 以存取日曆與 Tasks 待辦</div>
          </div>
          <button id="authBtn" onclick="requestGoogleAuth()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition">
            連動授權
          </button>
        </div>

        <!-- 四象限來源選擇區 -->
        <div class="pt-2 border-t border-morandi-border">
          <h4 class="font-medium text-morandi-text mb-2 flex items-center gap-1.5">
            <i class="ph-bold ph-intersect"></i>
            <span>四象限對應資料來源 (日曆 / Tasks 待辦)</span>
          </h4>
          <p class="text-xs text-morandi-muted mb-3">各象限可自由綁定特定 Google 日曆或 Google Tasks 待辦清單：</p>

          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-3 bg-morandi-subtle/30 p-2.5 rounded-xl border border-morandi-border/60">
              <span class="text-xs font-semibold text-morandi-q1 shrink-0 flex items-center gap-1">
                <span class="w-2.5 h-2.5 rounded-full bg-morandi-q1 inline-block"></span>
                象限 1
              </span>
              <select id="q1CalSelect" class="cal-select flex-1 text-xs border border-morandi-border rounded-lg p-1.5 bg-white outline-none">
                <option value="cal:primary">日曆：主要日曆 (預設)</option>
              </select>
            </div>

            <div class="flex items-center justify-between gap-3 bg-morandi-subtle/30 p-2.5 rounded-xl border border-morandi-border/60">
              <span class="text-xs font-semibold text-morandi-q2 shrink-0 flex items-center gap-1">
                <span class="w-2.5 h-2.5 rounded-full bg-morandi-q2 inline-block"></span>
                象限 2
              </span>
              <select id="q2CalSelect" class="cal-select flex-1 text-xs border border-morandi-border rounded-lg p-1.5 bg-white outline-none">
                <option value="none">-- 未指定 --</option>
              </select>
            </div>

            <div class="flex items-center justify-between gap-3 bg-morandi-subtle/30 p-2.5 rounded-xl border border-morandi-border/60">
              <span class="text-xs font-semibold text-morandi-q3 shrink-0 flex items-center gap-1">
                <span class="w-2.5 h-2.5 rounded-full bg-morandi-q3 inline-block"></span>
                象限 3
              </span>
              <select id="q3CalSelect" class="cal-select flex-1 text-xs border border-morandi-border rounded-lg p-1.5 bg-white outline-none">
                <option value="none">-- 未指定 --</option>
              </select>
            </div>

            <div class="flex items-center justify-between gap-3 bg-morandi-subtle/30 p-2.5 rounded-xl border border-morandi-border/60">
              <span class="text-xs font-semibold text-morandi-q4 shrink-0 flex items-center gap-1">
                <span class="w-2.5 h-2.5 rounded-full bg-morandi-q4 inline-block"></span>
                象限 4
              </span>
              <select id="q4CalSelect" class="cal-select flex-1 text-xs border border-morandi-border rounded-lg p-1.5 bg-white outline-none">
                <option value="none">-- 未指定 --</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button onclick="closeConfigModal()" class="px-4 py-2 border border-morandi-border text-morandi-muted hover:text-morandi-text rounded-xl text-xs font-medium">關閉</button>
        <button onclick="saveConfig()" class="px-4 py-2 bg-morandi-text text-white rounded-xl text-xs font-medium">儲存配置並同步</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       狀態與預設資料
    ========================================== */
    let currentDate = new Date();
    let isAnchorNearest = true;
    let accessToken = null;
    let tokenClient = null;

    let quadTitles = JSON.parse(localStorage.getItem('quad_titles')) || {
      1: "重要且緊急",
      2: "重要不緊急",
      3: "緊急不重要",
      4: "稍後思考"
    };

    let quadSources = JSON.parse(localStorage.getItem('quad_sources')) || {
      1: "cal:primary",
      2: "none",
      3: "none",
      4: "none"
    };

    let userCalendars = [];
    let userTaskLists = [];
    let combinedItems = [];

    /* ==========================================
       初始化
    ========================================== */
    window.addEventListener('DOMContentLoaded', () => {
      const savedClientId = localStorage.getItem('gcal_client_id') || '';
      document.getElementById('clientIdInput').value = savedClientId;

      updateDateHeader();
      loadQuadTitlesUI();
      updateQuadTagsUI();
      renderAll();

      if (savedClientId) {
        initGoogleClient(savedClientId);
      }
    });

    function updateDateHeader() {
      const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const start = new Date(currentDate);
      const end = new Date(currentDate);
      end.setDate(end.getDate() + 6);

      const formatDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      const statusSuffix = isAnchorNearest ? ' · 最近行程起始' : '';

      document.getElementById('currentDateDisplay').innerText = 
        `${start.getFullYear()}年 ${formatDate(start)} (${days[start.getDay()]}) ~ ${formatDate(end)} (${days[end.getDay()]})${statusSuffix}`;
    }

    function changeDay(delta) {
      isAnchorNearest = false;
      currentDate.setDate(currentDate.getDate() + delta);
      updateDateHeader();
      fetchAllData();
    }

    /* ==========================================
       Google Identity Services 授權
    ========================================== */
    function initGoogleClient(clientId) {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(() => initGoogleClient(clientId), 500);
        return;
      }

      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events.readonly https://www.googleapis.com/auth/tasks.readonly',
          callback: async (response) => {
            if (response.error) {
              console.error('[Google Auth Error]', response);
              alert('Google 授權失敗：' + (response.error_description || response.error));
              return;
            }
            accessToken = response.access_token;
            updateSyncStatus(true);
            await loadAllMetaLists();
            await alignToNearestEvent();
          },
        });
      } catch (err) {
        console.error('[Google Init Exception]', err);
      }
    }

    function requestGoogleAuth() {
      const inputId = document.getElementById('clientIdInput').value.trim();
      if (!inputId) {
        alert('請先輸入 Google OAuth Client ID！');
        return;
      }
      localStorage.setItem('gcal_client_id', inputId);
      
      if (!tokenClient) initGoogleClient(inputId);

      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        alert('Google 服務載入中，請稍候 3 秒後再試一次。');
      }
    }

    function updateSyncStatus(connected) {
      const ind = document.getElementById('syncIndicator');
      const txt = document.getElementById('syncStatusText');
      const modalTxt = document.getElementById('modalAuthStatus');
      const authBtn = document.getElementById('authBtn');

      if (connected) {
        ind.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        txt.innerText = '已連線 (日曆與 Tasks 待辦)';
        txt.className = 'text-emerald-700 font-medium';
        modalTxt.innerText = '已連線成功';
        modalTxt.className = 'font-medium text-emerald-600';
        authBtn.innerText = '重新授權';
      } else {
        ind.className = 'w-2 h-2 rounded-full bg-morandi-muted/40';
        txt.innerText = '未連動 Google 帳號';
        txt.className = 'text-morandi-muted';
        modalTxt.innerText = '未授權';
        modalTxt.className = 'font-medium text-morandi-text';
        authBtn.innerText = '連動授權';
      }
    }

    /* ==========================================
       自動尋找最近行程以對齊視圖
    ========================================== */
    async function alignToNearestEvent() {
      isAnchorNearest = true;
      if (!accessToken) {
        currentDate = new Date();
        updateDateHeader();
        fetchAllData();
        return;
      }

      const syncIcon = document.getElementById('syncIcon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const now = new Date();
        const maxCheck = new Date(now);
        maxCheck.setDate(maxCheck.getDate() + 30);

        const activeSources = Object.values(quadSources).filter(s => s && s !== 'none');
        let targetCalIds = activeSources.filter(s => s.startsWith('cal:')).map(s => s.replace('cal:', ''));
        if (targetCalIds.length === 0) targetCalIds.push('primary');

        let earliestTime = null;

        for (const calId of targetCalIds) {
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${now.toISOString()}&timeMax=${maxCheck.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=1`;
          const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (res.ok) {
            const data = await res.json();
            if (data.items && data.items.length > 0) {
              const ev = data.items[0];
              const t = ev.start.dateTime ? new Date(ev.start.dateTime).getTime() : new Date(ev.start.date + 'T00:00:00').getTime();
              if (!earliestTime || t < earliestTime) {
                earliestTime = t;
              }
            }
          }
        }

        if (earliestTime) {
          currentDate = new Date(earliestTime);
        } else {
          currentDate = new Date();
        }
      } catch (e) {
        currentDate = new Date();
      }

      updateDateHeader();
      await fetchAllData();
    }

    /* ==========================================
       取得日曆清單與 Tasks 待辦清單清冊
    ========================================== */
    async function loadAllMetaLists() {
      if (!accessToken) return;

      try {
        const calRes = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (calRes.ok) {
          const calData = await calRes.json();
          userCalendars = (calData.items || []).map(c => ({
            id: c.id,
            summary: c.summaryOverride || c.summary,
            primary: c.primary || false
          }));
        }

        const taskRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (taskRes.ok) {
          const taskData = await taskRes.json();
          userTaskLists = (taskData.items || []).map(t => ({
            id: t.id,
            title: t.title
          }));
        }

        populateSelectOptions();
        updateQuadTagsUI();
      } catch (err) {
        console.error('[MetaLists Error]', err);
      }
    }

    function populateSelectOptions() {
      for (let i = 1; i <= 4; i++) {
        const select = document.getElementById(`q${i}CalSelect`);
        select.innerHTML = '<option value="none">-- 未指定 --</option>';

        if (userCalendars.length > 0) {
          const optGroupCal = document.createElement('optgroup');
          optGroupCal.label = "📅 Google 日曆";
          userCalendars.forEach(cal => {
            const opt = document.createElement('option');
            opt.value = `cal:${cal.id}`;
            opt.innerText = `${cal.summary} ${cal.primary ? '(主要日曆)' : ''}`;
            if (quadSources[i] === `cal:${cal.id}` || (quadSources[i] === 'cal:primary' && cal.primary)) {
              opt.selected = true;
            }
            optGroupCal.appendChild(opt);
          });
          select.appendChild(optGroupCal);
        }

        if (userTaskLists.length > 0) {
          const optGroupTask = document.createElement('optgroup');
          optGroupTask.label = "✅ Google Tasks 待辦清單";
          userTaskLists.forEach(t => {
            const opt = document.createElement('option');
            opt.value = `task:${t.id}`;
            opt.innerText = t.title;
            if (quadSources[i] === `task:${t.id}`) {
              opt.selected = true;
            }
            optGroupTask.appendChild(opt);
          });
          select.appendChild(optGroupTask);
        }
      }
    }

    /* ==========================================
       抓取 Google 日曆行程與 Tasks 待辦事項
    ========================================== */
    async function fetchAllData() {
      const syncIcon = document.getElementById('syncIcon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      if (!accessToken) {
        if (syncIcon) setTimeout(() => syncIcon.classList.remove('animate-spin'), 300);
        renderAll();
        return;
      }

      const start = new Date(currentDate);
      start.setHours(0, 0, 0, 0);

      const end = new Date(currentDate);
      end.setDate(end.getDate() + 6);
      end.setHours(23, 59, 59, 999);

      const days = ['日', '一', '二', '三', '四', '五', '六'];
      combinedItems = [];

      try {
        const activeSources = Object.values(quadSources).filter(s => s && s !== 'none');
        let targetCalIds = activeSources.filter(s => s.startsWith('cal:')).map(s => s.replace('cal:', ''));
        let targetTaskIds = activeSources.filter(s => s.startsWith('task:')).map(s => s.replace('task:', ''));

        if (targetCalIds.length === 0 && targetTaskIds.length === 0) targetCalIds.push('primary');

        targetCalIds = [...new Set(targetCalIds)];
        targetTaskIds = [...new Set(targetTaskIds)];

        // A. 抓取日曆行程
        const calPromises = targetCalIds.map(async (calId) => {
          const encodedId = encodeURIComponent(calId);
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodedId}/events?timeMin=${start.toISOString()}&timeMax=${end.toISOString()}&singleEvents=true&orderBy=startTime`;
          const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (!res.ok) return [];
          const data = await res.json();
          const calMeta = userCalendars.find(c => c.id === calId);
          const calName = calMeta ? calMeta.summary : (calId === 'primary' ? '主要日曆' : '日曆');

          return (data.items || []).map(ev => {
            let dateText = "";
            let timeText = "全天";
            let sortTimestamp = 0;
            let eventDate = null;
            let isAllDay = false;

            if (ev.start.dateTime) {
              const s = new Date(ev.start.dateTime);
              const e = new Date(ev.end.dateTime);
              eventDate = new Date(s.getFullYear(), s.getMonth(), s.getDate());
              sortTimestamp = s.getTime();
              dateText = `${s.getMonth() + 1}/${s.getDate()} (週${days[s.getDay()]})`;
              timeText = `${String(s.getHours()).padStart(2,'0')}:${String(s.getMinutes()).padStart(2,'0')} - ${String(e.getHours()).padStart(2,'0')}:${String(e.getMinutes()).padStart(2,'0')}`;
            } else if (ev.start.date) {
              const parts = ev.start.date.split('-');
              eventDate = new Date(parts[0], parts[1] - 1, parts[2]);
              sortTimestamp = eventDate.getTime();
              dateText = `${eventDate.getMonth() + 1}/${eventDate.getDate()} (週${days[eventDate.getDay()]})`;
              timeText = "全天";
              isAllDay = true;
            }

            return {
              id: ev.id,
              sourceType: 'cal',
              sourceId: calId,
              sourceLabel: calName,
              title: ev.summary || "(無標題)",
              dateText: dateText,
              timeText: timeText,
              sortTimestamp: sortTimestamp,
              eventDate: eventDate,
              isAllDay: isAllDay,
              location: ev.location || ""
            };
          });
        });

        // B. 抓取 Tasks 待辦事項
        const taskPromises = targetTaskIds.map(async (listId) => {
          const url = `https://tasks.googleapis.com/tasks/v1/lists/${encodeURIComponent(listId)}/tasks?showCompleted=false&maxResults=100`;
          const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
          if (!res.ok) return [];
          const data = await res.json();
          const listMeta = userTaskLists.find(t => t.id === listId);
          const listName = listMeta ? listMeta.title : '待辦清單';

          return (data.items || []).filter(t => t.title && t.title.trim() !== '').map(t => {
            let dateText = "待辦";
            let sortTimestamp = start.getTime();
            let eventDate = null;

            if (t.due) {
              const d = new Date(t.due);
              eventDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
              sortTimestamp = d.getTime();
              dateText = `${d.getMonth() + 1}/${d.getDate()} (週${days[d.getDay()]})`;
            }

            return {
              id: t.id,
              sourceType: 'task',
              sourceId: listId,
              sourceLabel: listName,
              title: t.title,
              dateText: dateText,
              timeText: t.due ? "指定日期" : "隨時待辦",
              sortTimestamp: sortTimestamp,
              eventDate: eventDate,
              isAllDay: false,
              location: ""
            };
          });
        });

        const [calResults, taskResults] = await Promise.all([
          Promise.all(calPromises),
          Promise.all(taskPromises)
        ]);

        combinedItems = [...calResults.flat(), ...taskResults.flat()].sort((a, b) => a.sortTimestamp - b.sortTimestamp);

        document.getElementById('lastSyncTime').innerText = `上次同步: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      } catch (err) {
        console.error('[FetchAllData Error]', err);
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        renderAll();
      }
    }

    /* ==========================================
       動態計算莫蘭迪階梯底色核心函式
    ========================================== */
    function getItemCardStyles(item) {
      // 基準日以 00:00:00 計算天數差異
      const baseDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime();
      let diffDays = 0;

      if (item.eventDate) {
        const itemDay = new Date(item.eventDate.getFullYear(), item.eventDate.getMonth(), item.eventDate.getDate()).getTime();
        diffDays = Math.round((itemDay - baseDay) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) diffDays = 0;
      }

      // 1. 全日活動（底色加深更多，凸顯重要或佔滿整天之特性）
      if (item.isAllDay) {
        if (diffDays === 0) {
          // 今天全日
          return "background-color: #E6E1D8; border-color: #D3CCC0;";
        } else if (diffDays === 1) {
          // 明天全日
          return "background-color: #DDD7CE; border-color: #CAC2B5;";
        } else if (diffDays === 2) {
          // 後天全日
          return "background-color: #D5CEBF; border-color: #C0B7A6;";
        } else {
          // 3 天以上全日
          return "background-color: #CCC4B4; border-color: #B5AB99;";
        }
      }

      // 2. 一般時段活動與待辦（隨日期漸進加深）
      if (diffDays === 0) {
        // 今天 / 基準日：原來的淡雅米白底色
        return "background-color: #FDFBF8; border-color: #E8E4DC;";
      } else if (diffDays === 1) {
        // 隔天：溫暖微加深
        return "background-color: #F3EFE9; border-color: #E2DDD5;";
      } else if (diffDays === 2) {
        // 再隔天：進一步加深
        return "background-color: #EBE5DC; border-color: #D8D1C6;";
      } else {
        // 3 天以上：沉穩莫蘭迪灰褐底色
        return "background-color: #E2DBD0; border-color: #CDC5B7;";
      }
    }

    /* ==========================================
       畫面渲染
    ========================================== */
    function renderAll() {
      renderTimeline();
      renderQuadrants();
    }

    function renderTimeline() {
      const container = document.getElementById('timelineList');
      const badge = document.getElementById('timelineCountBadge');
      container.innerHTML = '';

      badge.innerText = `${combinedItems.length} 項項目`;

      if (combinedItems.length === 0) {
        container.innerHTML = `
          <div class="h-48 flex flex-col items-center justify-center text-morandi-muted text-xs">
            <i class="ph-bold ph-calendar-x text-3xl mb-2 opacity-40"></i>
            <span>選定視圖內尚無排程或待辦</span>
          </div>`;
        return;
      }

      combinedItems.forEach(item => {
        const div = document.createElement('div');
        const isTask = item.sourceType === 'task';
        const badgeClass = isTask ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-700';
        
        // 取得動態深淺底色
        const customStyle = getItemCardStyles(item);

        div.className = "p-3 rounded-xl border transition flex flex-col gap-1.5 shadow-sm hover:brightness-95";
        div.style = customStyle;

        div.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="font-medium text-sm text-morandi-text truncate">${escapeHtml(item.title)}</div>
            <div class="flex items-center gap-1">
              ${item.isAllDay ? '<span class="text-[10px] px-1.5 py-0.5 bg-morandi-text/10 text-morandi-text rounded font-semibold">整天</span>' : ''}
              <span class="text-[10px] px-2 py-0.5 rounded font-medium ${badgeClass}">${escapeHtml(item.sourceLabel)}</span>
            </div>
          </div>
          <div class="flex items-center flex-wrap gap-2 text-xs text-morandi-muted">
            <span class="font-semibold text-morandi-text/80 bg-white/70 px-1.5 py-0.5 rounded border border-morandi-border/50">${item.dateText}</span>
            <div class="flex items-center gap-1">
              <i class="ph-bold ${isTask ? 'ph-check-square' : 'ph-clock'}"></i>
              <span>${item.timeText}</span>
            </div>
            ${item.location ? `<span>·</span><span class="truncate max-w-[120px]">${escapeHtml(item.location)}</span>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderQuadrants() {
      for (let q = 1; q <= 4; q++) {
        const listEl = document.getElementById(`q${q}List`);
        const badgeEl = document.getElementById(`q${q}Badge`);
        listEl.innerHTML = '';

        const srcBinding = quadSources[q];
        
        const qItems = combinedItems.filter(item => {
          if (!srcBinding || srcBinding === 'none') return false;
          if (srcBinding.startsWith('cal:')) {
            const calId = srcBinding.replace('cal:', '');
            if (item.sourceType !== 'cal') return false;
            if (calId === 'primary') return item.sourceId === 'primary' || (userCalendars.find(c => c.id === item.sourceId)?.primary);
            return item.sourceId === calId;
          } else if (srcBinding.startsWith('task:')) {
            const taskId = srcBinding.replace('task:', '');
            return item.sourceType === 'task' && item.sourceId === taskId;
          }
          return false;
        });

        badgeEl.innerText = qItems.length;

        if (qItems.length === 0) {
          listEl.innerHTML = `<div class="h-32 flex items-center justify-center text-xs text-morandi-muted/60">無排程項目</div>`;
          continue;
        }

        qItems.forEach(item => {
          const div = document.createElement('div');
          const customStyle = getItemCardStyles(item);

          div.className = "flex items-center justify-between p-2.5 rounded-xl border transition text-sm shadow-2xs hover:brightness-95";
          div.style = customStyle;

          div.innerHTML = `
            <div class="flex items-center gap-2 overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-morandi-text/50 shrink-0"></span>
              <span class="truncate text-morandi-text font-medium">${escapeHtml(item.title)}</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-morandi-muted shrink-0 ml-2">
              <span class="font-medium text-morandi-text/75 bg-white/50 px-1 py-0.5 rounded">${item.dateText.split(' ')[0]}</span>
              <span>${item.timeText.split(' - ')[0]}</span>
            </div>
          `;
          listEl.appendChild(div);
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function loadQuadTitlesUI() {
      for (let i = 1; i <= 4; i++) {
        const input = document.getElementById(`q${i}TitleInput`);
        if (input && quadTitles[i]) input.value = quadTitles[i];
      }
    }

    function updateQuadTitle(qNum, val) {
      quadTitles[qNum] = val.trim() || `象限 ${qNum}`;
      localStorage.setItem('quad_titles', JSON.stringify(quadTitles));
    }

    function updateQuadTagsUI() {
      for (let i = 1; i <= 4; i++) {
        const tag = document.getElementById(`q${i}CalTag`);
        const srcId = quadSources[i];
        if (!srcId || srcId === 'none') {
          tag.innerText = "未綁定";
          tag.className = "text-[11px] px-2 py-0.5 bg-morandi-subtle/50 text-morandi-muted rounded-md font-normal";
        } else if (srcId.startsWith('cal:')) {
          const calId = srcId.replace('cal:', '');
          const found = userCalendars.find(c => c.id === calId);
          tag.innerText = found ? found.summary : (calId === 'primary' ? '主要日曆' : '日曆');
          tag.className = "text-[11px] px-2 py-0.5 bg-blue-50 text-blue-700 rounded-md font-medium truncate max-w-[100px]";
        } else if (srcId.startsWith('task:')) {
          const listId = srcId.replace('task:', '');
          const found = userTaskLists.find(t => t.id === listId);
          tag.innerText = found ? `待辦: ${found.title}` : '待辦事項';
          tag.className = "text-[11px] px-2 py-0.5 bg-amber-50 text-amber-800 rounded-md font-medium truncate max-w-[100px]";
        }
      }
    }

    /* ==========================================
       彈窗控制與設定儲存
    ========================================== */
    function openConfigModal() {
      if (userCalendars.length > 0 || userTaskLists.length > 0) {
        populateSelectOptions();
      }
      document.getElementById('configModal').classList.remove('hidden');
    }
    
    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveConfig() {
      const id = document.getElementById('clientIdInput').value.trim();
      localStorage.setItem('gcal_client_id', id);

      for (let i = 1; i <= 4; i++) {
        quadSources[i] = document.getElementById(`q${i}CalSelect`).value;
      }
      localStorage.setItem('quad_sources', JSON.stringify(quadSources));

      updateQuadTagsUI();
      closeConfigModal();
      alignToNearestEvent();
    }

    function resetDefaults() {
      if (confirm('確定要重設象限名稱與綁定設定嗎？')) {
        localStorage.removeItem('quad_titles');
        localStorage.removeItem('quad_sources');
        location.reload();
      }
    }
  </script>
